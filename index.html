<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오더정리 - 병원 치료사용</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>오더정리</h1>
            <p class="subtitle">부족한 오더 목록 → 메신저 양식 변환</p>
        </header>

        <!-- 설정 섹션 -->
        <section class="settings-section">
            <!-- 층 선택 -->
            <div class="setting-row">
                <label class="setting-label">층</label>
                <div class="btn-group" id="floorGroup">
                    <button type="button" class="btn-option" data-value="2">②</button>
                    <button type="button" class="btn-option" data-value="3">③</button>
                    <button type="button" class="btn-option" data-value="4">④</button>
                    <button type="button" class="btn-option" data-value="5">⑤</button>
                    <button type="button" class="btn-option" data-value="6">⑥</button>
                </div>
            </div>

            <!-- 직종 선택 -->
            <div class="setting-row">
                <label class="setting-label">직종</label>
                <div class="btn-group" id="jobGroup">
                    <button type="button" class="btn-option" data-value="물리치료사">물리치료사</button>
                    <button type="button" class="btn-option" data-value="작업치료사">작업치료사</button>
                </div>
            </div>

            <!-- 치료사 선택 -->
            <div class="setting-row">
                <label class="setting-label">치료사</label>
                <div class="btn-group therapist-group" id="therapistGroup">
                    <!-- 동적으로 생성됨 -->
                </div>
                <button type="button" class="btn-manage" id="manageTherapistBtn" title="치료사 관리">⚙️</button>
            </div>

            <!-- 날짜 선택 -->
            <div class="setting-row">
                <label class="setting-label">날짜</label>
                <input type="date" id="dateInput" class="date-input">
                <span class="date-display" id="dateDisplay"></span>
            </div>
        </section>

        <!-- 추가오더 입력 섹션 -->
        <section class="input-section">
            <div class="section-header">
                <h2>추가오더</h2>
                <span class="hint">엑셀에서 복사하여 붙여넣기</span>
            </div>
            <textarea id="addInputArea" placeholder="환자명 오더코드 (최소)&#10;예: 김원순 M7&#10;예: 이예지/김원순/RG2/11:25&#10;예: 박진희	ROM MMT	00:00 (탭 구분)"></textarea>
        </section>

        <!-- 삭제오더 입력 섹션 -->
        <section class="input-section">
            <div class="section-header">
                <h2>삭제오더</h2>
                <span class="hint">없으면 비워두세요</span>
            </div>
            <textarea id="deleteInputArea" placeholder="삭제할 오더가 있으면 입력"></textarea>
        </section>

        <!-- 단위 확인 섹션 (숨김 기본) -->
        <section class="unit-check-section" id="unitCheckSection" style="display: none;">
            <div class="section-header">
                <h2>⚠️ 단위 확인 필요</h2>
                <span class="hint">기본값: 2</span>
            </div>
            <div class="unit-check-list" id="unitCheckList">
                <!-- 동적으로 생성됨 -->
            </div>
        </section>

        <!-- 버튼 섹션 -->
        <section class="action-section">
            <button type="button" class="btn-primary" id="convertBtn">변환</button>
        </section>

        <!-- 출력 섹션 -->
        <section class="output-section">
            <div class="section-header">
                <h2>결과</h2>
                <button type="button" class="btn-copy" id="copyBtn">📋 복사</button>
            </div>
            <div class="output-area" id="outputArea"></div>
        </section>

        <!-- 환자 데이터 관리 섹션 -->
        <section class="patient-section">
            <div class="section-header">
                <h2>환자 마스터 데이터</h2>
                <span class="patient-count" id="patientCount">0명</span>
            </div>
            <div class="patient-actions">
                <input type="file" id="excelUpload" accept=".xlsx,.xls" style="display: none;">
                <button type="button" class="btn-secondary" id="uploadBtn">📁 엑셀 업로드</button>
                <button type="button" class="btn-secondary" id="clearPatientBtn">🗑️ 초기화</button>
            </div>
        </section>
    </div>

    <!-- 치료사 관리 모달 -->
    <div class="modal" id="therapistModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>치료사 관리</h3>
                <button type="button" class="btn-close" id="closeTherapistModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="add-therapist">
                    <input type="text" id="newTherapistName" placeholder="치료사 이름">
                    <button type="button" class="btn-add" id="addTherapistBtn">추가</button>
                </div>
                <ul class="therapist-list" id="therapistList">
                    <!-- 동적으로 생성됨 -->
                </ul>
            </div>
        </div>
    </div>

    <!-- 환자 데이터 변경 미리보기 모달 -->
    <div class="modal" id="patientPreviewModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>환자 데이터 변경 미리보기</h3>
                <button type="button" class="btn-close" id="closePatientPreviewModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="preview-tabs">
                    <button type="button" class="tab-btn active" data-tab="added">추가 (<span id="addedCount">0</span>)</button>
                    <button type="button" class="tab-btn" data-tab="modified">변경 (<span id="modifiedCount">0</span>)</button>
                    <button type="button" class="tab-btn" data-tab="all">전체 (<span id="allCount">0</span>)</button>
                </div>
                <div class="preview-content" id="previewContent">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelPatientUpload">취소</button>
                <button type="button" class="btn-primary" id="applyPatientUpload">적용</button>
            </div>
        </div>
    </div>

    <!-- 알림 토스트 -->
    <div class="toast" id="toast"></div>

    <!-- JavaScript 파일들 -->
    <script src="js/constants.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/formatter.js"></script>
    <script src="js/patient.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
